name: ESPN historical backfill (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch private ESPN league and validate weeks 1–4
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/refresh.py --output-dir output
      - name: Upload validation and Team DNA preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: espn-backfill-report
          path: output/*.json
          if-no-files-found: warn
          retention-days: 7

/* Visual system refinements · v2 */
:root{--bg:#f4f6fa;--line:#e7ecf3;--shadow:0 4px 17px rgba(23,43,73,.028)}
.main{max-width:1560px;padding-inline:clamp(18px,2.6vw,42px)}
.card{border-radius:15px;padding:clamp(18px,1.65vw,25px)}
.sectionhead{margin-bottom:17px;flex-wrap:wrap}
.sectiontitle{font-size:15px;line-height:1.35}
.sublabel{font-size:12px;line-height:1.55;max-width:67ch}
.slot{grid-template-columns:repeat(auto-fit,minmax(min(100%,550px),1fr));gap:16px}
.subgrid{grid-template-columns:repeat(auto-fit,minmax(min(100%,490px),1fr));align-items:start}
.distcard{min-width:0}
.distlegend{display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin:0 0 18px;padding:12px 0;border-bottom:1px solid var(--line)}
.distlegend span{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#64758b;font-weight:600;white-space:nowrap}
.distlegend i{display:inline-block;width:10px;height:10px;border-radius:3px}
.disthead,.distrow{display:grid;grid-template-columns:minmax(0,1.16fr) minmax(135px,1.02fr) 80px;align-items:center;gap:14px;min-width:0}
.disthead{padding:0 9px 6px;color:#8b98aa;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.disthead > :last-child{text-align:right}
.distrow{padding:13px 9px;border-bottom:1px solid #edf0f5;transition:background .15s;border-radius:8px;min-height:74px}
.distrow:last-child{border-bottom:0}
.distrow .rankname{font-size:12px;font-weight:740;line-height:1.35;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}
.distrow .tiny{display:block;margin-top:3px;font-size:11px;line-height:1.4;color:#8491a3}
.distrow .stack{min-width:0;width:100%}
.distrow .percentile{display:flex;flex-direction:column;text-align:right;line-height:1.12;white-space:nowrap;align-items:flex-end}
.distrow .percentile strong{font-size:15px;letter-spacing:-.025em;font-variant-numeric:tabular-nums;color:#1d344f}
.distrow .percentile small{font-size:9px;color:#8190a2;font-weight:650;margin-top:4px;letter-spacing:.035em}
.distrow.selected{background:#edf4ff;outline:1px solid #dceaff}
.distrow:hover{background:#f5f9ff}
.distrow.selected:hover{background:#edf4ff}
.stack{height:15px;background:#eef2f7;border-radius:5px;min-width:0;display:flex;overflow:hidden}
.stack span{min-width:0;flex-shrink:0;border-right:1px solid rgba(255,255,255,.5)}
.stack span:last-child{border-right:0}
.rankline{grid-template-columns:minmax(0,1.16fr) minmax(100px,1.14fr) 61px;gap:12px;min-width:0;padding:7px 6px;min-height:43px}
.rankname{font-size:12px;line-height:1.35;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}
.ranksub{margin-top:2px}
.lucktrack{height:13px;border-radius:5px}
.luckbar{border-radius:3px}
.barrow{grid-template-columns:minmax(0,1.12fr) minmax(95px,1.5fr) 67px;gap:12px;padding:11px 2px;min-height:47px;min-width:0}
.barrow .name{font-size:12px;line-height:1.3;white-space:normal;text-overflow:clip;overflow:visible;overflow-wrap:anywhere}
.barrow .med{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.barback{height:11px;border-radius:5px;background:#edf1f6}
.barfill{border-radius:5px}
.barrow.selected{background:#f1f6ff;border-radius:7px}
.barrow:hover[data-select]{background:#f7faff;border-radius:7px}
.rankBarCaption{font-size:11px;color:#8290a3;padding-top:10px}
.perftrack{height:13px;background:linear-gradient(90deg,#fbeef0 0 49.7%,#b4c3d8 49.7% 50.3%,#ebf8f3 50.3% 100%);border-radius:5px;position:relative;overflow:hidden}
.perftrack .perfbar{height:100%;position:absolute;border-radius:3px}
.graphlegend{justify-content:flex-start;gap:20px;margin:11px 0 0 48px}
.graphlegend span{display:flex;align-items:center;gap:7px}
.graphlegend b{width:18px;height:0;border-top:3px solid;display:inline-block;margin:0}
.scorecard{grid-template-columns:minmax(0,1.25fr) minmax(64px,auto) 21px minmax(64px,auto) minmax(0,1.25fr);gap:15px}
.scorecard .name{overflow-wrap:anywhere;line-height:1.35}
.scorecard .score{text-align:center;font-size:22px}
.scorecard .meta{margin-top:3px}
.winbox{align-items:center}
.winsbig{white-space:nowrap;font-variant-numeric:tabular-nums}
.barcardnote{font-size:11px;color:#78869c;margin:14px 0 0;line-height:1.5}
@media(max-width:1050px){.slot,.subgrid{grid-template-columns:1fr}.disthead,.distrow{grid-template-columns:minmax(0,1.16fr) minmax(135px,1.1fr) 80px}.rankline{grid-template-columns:minmax(0,1.2fr) minmax(100px,1fr) 65px}}
@media(max-width:720px){.main{padding:20px 14px 48px}.card{padding:17px}.distrow,.disthead{grid-template-columns:minmax(0,1.17fr) minmax(105px,1fr) 66px;gap:8px}.distrow{padding:11px 5px;min-height:70px}.disthead{padding:0 5px 8px;font-size:9px}.distrow .percentile strong{font-size:13px}.distrow .rankname{font-size:11px}.distlegend{gap:9px}.distlegend span{font-size:10px}.rankline{grid-template-columns:minmax(0,1.2fr) minmax(85px,1fr) 55px;gap:8px}.barrow{grid-template-columns:minmax(0,1.05fr) minmax(85px,1.2fr) 60px;gap:8px}.barrow .name{font-size:11px}.graphlegend{margin-left:8px;gap:13px}.scorecard{grid-template-columns:minmax(0,1.05fr) 51px 13px 51px minmax(0,1.05fr);gap:5px}.scorecard .score{font-size:17px}.scorecard .name{font-size:10px}.scorecard .meta{font-size:9px}.scorecard .vs{font-size:10px}.winbox{gap:9px}.winsbig{font-size:29px}}
@media(max-width:380px){.disthead,.distrow{grid-template-columns:minmax(0,1.15fr) minmax(82px,1fr) 51px;gap:6px}.distrow .percentile strong{font-size:12px}.distrow .percentile small{font-size:8px}.scorecard .score{font-size:15px}}

/* Overview: compact, responsive season-to-date trend cards */

.trendtop{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.trendmetric{text-align:right;white-space:nowrap}

.trendmetric small{display:block;color:#74869f;font-size:11px;margin-top:3px}
.trendsvg{width:100%;height:auto;display:block;margin-top:12px;overflow:visible}
.trendfooter{font-size:11px;color:#74869f;margin-top:3px;line-height:1.5}
.trenddot{stroke:white;stroke-width:2.5}
@media(max-width:850px){.trendgrid{grid-template-columns:1fr}}
@media(max-width:420px){.trendmetric strong{font-size:19px}.trendtop{gap:8px}}

function rosterLeagueComparison(){
 const ra=DB.rosterAnalysis;
 if(!ra||ra.status!=='validated-final-rosters'||!Array.isArray(ra.weeks)||ra.weeks.length!==DB.completedThrough||ra.throughWeek!==DB.completedThrough)return null;
 return teams.map(team=>{
  const rows=ra.weeks.map(w=>w.teams.find(x=>x.teamId===team.id));
  if(rows.some(x=>!x))return null;
  const hits=rows.reduce((n,x)=>n+x.weightedHits,0),maximum=rows.reduce((n,x)=>n+x.weightedMax,0),possible=rows.length*METRICS.lineup.weightedPossible;
  return {id:team.id,hits,maximum,possible,swr:100*hits/possible,ceiling:100*maximum/possible,capture:maximum?100*hits/maximum:null,benchCount:rows.reduce((n,x)=>n+x.potentiallyUsefulBenchCount,0),benchMiss:rows.reduce((n,x)=>n+x.missedWeighted,0)};
 }).filter(Boolean);
}
function lineupOverviewCard(t){

 const swrs=comparison.map(x=>x.swr),ceilings=comparison.map(x=>x.ceiling),captures=comparison.map(x=>x.capture).filter(Number.isFinite),misses=comparison.map(x=>x.benchMiss);
 const headline=mine.benchMiss>0?`${mine.benchCount} bench performances could have improved your starting lineup.`:'Your bench offered no additional qualifying lineup quality.';
 const benchmark=(value,values)=>`<small>${leagueComparison(value,values)}</small>`;
 return `<div class="card roster-action"><h3>${headline}</h3><p>Across ${DB.completedThrough} finalized weeks, your best legal lineup from starters and bench could have produced ${fmt(mine.maximum,1)} of ${mine.possible} possible quality points. Compare your results with the other nine teams:</p>
 <div class="roster-action-metrics"><div><strong>${fmt(mine.swr,1)}%</strong><span>Actual starter-worthy</span>${benchmark(mine.swr,swrs)}</div>
 <div><strong>${fmt(mine.ceiling,1)}%</strong><span>Roster ceiling</span>${benchmark(mine.ceiling,ceilings)}</div>
 <div><strong>${mine.capture===null?'N/A':fmt(mine.capture,1)+'%'}</strong><span>Available quality used</span>${mine.capture===null?'<small>No qualifying roster ceiling</small>':benchmark(mine.capture,captures)}</div></div>
 <p class="roster-context"><strong>Your bench:</strong> ${fmt(mine.benchMiss,1)} missed weighted quality points versus ${fmt(mean(misses),1)} league average · #${leagueRank(mine.benchMiss,misses)} of ${misses.length} most missed (higher means more left unused). <strong>Roster limitation:</strong> ${fmt(mine.possible-mine.maximum,1)} quality points were unavailable even with perfect hindsight. Kicker and defense count half as much.</p>
 <button class="action" data-tab="performance">See weekly lineup detail →</button></div>`;
}

function rankStack(t){return `<div class="stack" aria-label="Simulated position probabilities: ${t.rankDist.map((v,i)=>`place ${i+1}: ${fmt(v,1)} percent`).join(', ')}">${t.rankDist.map((v,i)=>`<span title="${i+1}${['st','nd','rd','th','th'][i]} place · ${fmt(v,1)}%" style="width:${v}%;background:${RANK_COLORS[i]}"></span>`).join('')}</div>`}
function commonRank(t){let best=t.rankDist.indexOf(Math.max(...t.rankDist));return {place:best+1,pct:t.rankDist[best]}}
function rankOrdinal(n){return `${n}${n===1?'st':n===2?'nd':n===3?'rd':'th'}`}
function standingsReading(t){

 return `<div class="simulation-verdict"><strong>${teamName(t)} finished #${t.divrank} in its division.</strong> Its most common historical reshuffled finish was #${most.place} (${fmt(most.pct,1)}% of runs). The actual finish was ${comparison} relative to that most common result. This describes a distribution of alternate schedules, not a separate luck score.</div>`;
}
function divisionSection(name){

 return `<div class="card distcard">${section(name,'Same scores, different weekly opponents')}<div class="distlegend">${RANK_COLORS.map((c,i)=>`<span><i style="background:${c}"></i>${rankOrdinal(i+1)}</span>`).join('')}</div><div class="disthead refined-disthead"><span>Team · actual</span><span>Chance of each finish</span><span>Most likely</span></div><div>${tt.map(t=>{let common=commonRank(t);return `<div class="distrow refined-distrow ${t.id===state.selected?'selected':''}" data-select="${t.id}" title="Tap to see ${esc(t.name)}"><div><div class="rankname">${teamName(t)}</div><div class="tiny">Actual: #${t.divrank} · ${t.wins}–${t.losses}</div></div>${rankStack(t)}<div class="likely"><strong>#${common.place}</strong><small>${fmt(common.pct,1)}% of runs</small></div></div>`}).join('')}</div></div>`;

function divisions(){
 const t=selected(),most=commonRank(t);

const methodMetric=(title,what,how,read)=>`<div class="method-item"><h4>${title}</h4><p><b>What it measures</b> ${what}</p><p><b>How we calculate it</b> ${how}</p>${read?`<p><b>How to read it</b> ${read}</p>`:''}</div>`;
const methodTopic=(title,summary,body)=>`<details class="method-topic"><summary><strong>${title}</strong><span>${summary}</span></summary><div class="method-topic-body">${body}</div></details>`;
function method(){
 const m=METRICS,cut=m.lineup.positionCutoffs,year=m.season;
 const topics=[
  methodTopic('Results & Schedule Luck','PF, all-play, expected wins and schedule impact.',`
   ${methodMetric('Points For (PF)','Your total finalized fantasy points scored. We also display points per week to make teams easier to compare.','Add your final weekly scores; divide by completed weeks for PF/week.','PF is a scoring measure, not the head-to-head record or official standings.')}
   ${methodMetric('All-Play Record','What if you faced every other team each week instead of just your scheduled opponent?','Compare your final score with all nine other teams each week, awarding half a comparison win for ties. Then add the results.','Beat six other teams in a week? That is six all-play wins.')}
   ${methodMetric('Expected Wins','Your completed scoring performance translated into a schedule-neutral expected record.','Divide each week’s all-play wins (including half-credit ties) by nine, then add the weekly expectations.','It is based on actual completed scores, not a pregame prediction.')}
   ${methodMetric('Extra Wins (Schedule Luck)','Whether the assigned schedule helped or hurt your actual record.','Actual wins − all-play expected wins.','Positive: your schedule helped. Negative: a tougher draw than your scoring suggests. Near zero: record and all-play expectation closely align. It does not measure draft or lineup skill.')}
   <p class="method-note"><b>What If?</b> Reshuffles completed weekly scores against alternative opponents to show possible division finishes. It provides context, not a second luck score.</p>`),
  methodTopic('Scoring & Team DNA','Scoring strength, volatility, identity and recent form.',`
   ${methodMetric('Scoring Identity (DNA)','The kind of scoring team you have been this season.',`Combine average PF/week compared with the current league average, and scoring volatility (CV). The high-volatility cutoff is above ${fmt(100*m.scoring.quadrantCvBoundary,0)}% CV.`,'Reliable contenders: above-average and steadier. High-upside wildcards: above-average and volatile. Steady, lower-output: below-average and steadier. Volatile underdogs: below-average and volatile. A score at the league average counts as high scoring.')}
   ${methodMetric('Volatility (CV)','How much your weekly scoring changes relative to your normal scoring level.','Population standard deviation of completed weekly PF ÷ your average weekly PF, expressed as a percentage.','A lower CV means steadier scoring. It does not directly measure management ability.')}
   ${methodMetric('Recent Form','Whether recent scoring is improving or declining.',`From Week ${m.momentum.minimumWeeks}, compare the latest ${m.momentum.earlyWindow}-week PF average with the previous ${m.momentum.earlyWindow}-week average. From Week ${m.momentum.fullWindowMinimumWeeks}, use ${m.momentum.window}-week windows.`,`Heating up means a gain of at least ${fmt(m.momentum.heatingPct,0)}% of your season PF/week; cooling off means ${fmt(m.momentum.coolingPct,0)}% or worse. Otherwise, mostly flat. Standings show raw PF/week movement; the Report Card also shows percentage movement.`)}
   <p class="method-note">A separate <b>recent four-week DNA</b> comparison becomes available at Week ${m.recentDna.minimumWeeks}. Scoring rank means total PF, highest first; it is not official playoff seeding.</p>`),
  methodTopic('Lineup Quality','Starter-Worthy Rate, roster ceiling and bench opportunities.',`
   ${methodMetric('Starter-Worthy Rate (SWR)','The share of your actual starters who were strong enough to qualify for their positions in that completed week.',`Check final NFL-wide performance against position cutoffs. The seven skill slots count ${m.lineup.skillWeight} each; kicker and defense count ${m.lineup.kickerWeight} each. Weighted qualifying points ÷ ${m.lineup.weightedPossible} possible points.`,'This uses finalized lineups and hindsight performance, not what could have been known before kickoff.')}
   ${methodMetric('Roster Ceiling','The best starter-worthy lineup you could legally have fielded from the players actually available on your roster.','Optimize final starters and bench into legal positions using finalized scores; exclude IR.','This measures available quality in hindsight rather than a pregame recommendation.')}
   ${methodMetric('Ceiling Captured','How much of that attainable roster quality you actually used.','Actual starting quality ÷ best attainable legal roster quality.','Higher means more quality captured. If no qualifying quality was attainable, show unavailable instead of dividing by zero.')}
   ${methodMetric('Bench Opportunity','Quality left unused because a legal bench substitution could improve the lineup.','Evaluate bench substitutions after accounting for improvements achievable by rearranging existing starters.','This is separate from simply assigning your starters to better eligible slots.')}
   ${methodMetric('Unavoidable Shortfall','Quality your roster could not have provided, even with a perfectly selected legal lineup.',`${m.lineup.weightedPossible} possible weighted points − the best attainable roster ceiling for that week.`,'It is a roster limitation, not a lineup-management mistake.')}
   <p class="method-note"><b>Exact weekly qualifying cutoffs:</b> QB top ${cut.QB}; RB and WR top ${cut.RB}/${cut.WR}; TE top ${cut.TE}; K and DST top ${cut.K}/${cut.DST}. FLEX also allows the ${m.lineup.flexAdditional} best additional remaining RB/WR/TE performers alongside positional qualifiers. All ties at a cutoff qualify. All ten teams are benchmarked over the same completed weeks.</p>`),
  methodTopic('Historical Franchise DNA','Recurring franchise tendencies across separately redrafted seasons.',`
   ${methodMetric('Historical Scoring Identity','Does a franchise tend to build the same type of scoring team from draft to draft?','Compare each verified completed season’s average PF/week with its own league average, and calculate that season’s CV. Weight these underlying values, then assign a DNA quadrant.',`Latest completed season: ${fmt(100*m.historicalDna.completedSeasonWeights[0],0)}%; previous: ${fmt(100*m.historicalDna.completedSeasonWeights[1],0)}%; third: ${fmt(100*m.historicalDna.completedSeasonWeights[2],0)}%. When fewer seasons are verified, available weights are renormalized.`)}
   ${methodMetric('Historical Consistency','How often the same scoring identity appeared across different drafts.','Count the completed seasons in the franchise’s most frequently observed quadrant, with each season counting equally.','For example, 2/3 means the same identity appeared twice in three verified seasons; a tie is shown as mixed.')}
   <p class="method-note">Only confirmed franchise continuity connects names across years; 2023 ESPN slot 6 belongs to a different owner from the 2024+ franchise. The ongoing ${year} season stays separate until it is complete and verified. Championships are permanent achievements and never decay with these scoring weights.</p>`),
  methodTopic('Data & Reliability','Final results, source checks and reporting limitations.',`
   ${methodMetric('Finalized Results','Current performance metrics use approved ESPN final matchup scores and validated final rosters.','Compare the same completed weeks for all ten teams; use final lineups for hindsight Starter-Worthy Rate and roster ceiling.','An unverified or missing result is unavailable—not a zero score.')}
   ${methodMetric('Pregame Projections','Actual scoring compared with genuine pregame expectations when evidence is sufficient.',`Show comparisons only after at least ${m.projection.minimumVerifiedWeeks} independent weekly pregame captures are explicitly verified.`,'In-game or unverified screenshots do not qualify.')}
   ${methodMetric('Historical Records','Verified regular-season scoring and separately confirmed champions.','The historical fingerprint uses the available completed regular-season snapshots; championship badges follow verified franchise IDs.','Scoring order is not official W–L standings. Full historical playoff brackets and qualification rules remain deferred until confirmed.')}
   <p class="method-note">Private ESPN credentials and owner identities are never published. Approved HTML and JSON include matching fallback data.</p>`)
 ];
 return `<div class="card bigmethod method-guide">${section('How the numbers work','Plain-English definitions first, detailed calculations available in each topic')}<p class="method-lede">Fantasy 2K Infinity uses finalized ESPN results to look beyond the standings. Pick a topic to learn what its metrics measure, how they work, and what the results mean.</p><div class="method-topics">${topics.join('')}</div></div>`;
}
/* Unified scoring DNA: the same four quadrant labels and cutoffs everywhere. */
const median=a=>{const b=[...a].sort((x,y)=>x-y),m=Math.floor(b.length/2);return b.length%2?b[m]:(b[m-1]+b[m])/2};
const stdev=a=>Math.sqrt(mean(a.map(x=>(x-mean(a))**2)));
let leagueMean=mean(teams.map(t=>t.pf/DB.completedThrough));
function scoringQuadrant(avg,cv,leagueAvg=leagueMean){
 const high=cv>METRICS.scoring.quadrantCvBoundary,right=avg>=leagueAvg;

}
function shortTeam(t){return METRICS.scoring.shortNames[String(t.id)]||t.name.slice(0,7);}

function buildScoringProfiles(){return Object.fromEntries(teams.map(t=>{
 const scores=t.weeks.map(w=>w.pf),n=scores.length,average=mean(scores),sd=stdev(scores),low=Math.min(...scores),high=Math.max(...scores),spread=high-low,cv=average>0?sd/average:0;
 const ready=n>=METRICS.momentum.minimumWeeks,window=n>=METRICS.momentum.fullWindowMinimumWeeks?METRICS.momentum.window:METRICS.momentum.earlyWindow;
 const oldScores=ready?scores.slice(-2*window,-window):[],newScores=ready?scores.slice(-window):[];
 const old=ready?mean(oldScores):null,recent=ready?mean(newScores):null,shift=ready?recent-old:null,relShift=ready?100*shift/Math.max(1,average):null;
 const momentum=!ready?null:relShift>=METRICS.momentum.heatingPct?'Heating up':relShift<=METRICS.momentum.coolingPct?'Cooling off':'Mostly flat';
 const trendClass=!ready?'':relShift>=METRICS.momentum.heatingPct?'green':relShift<=METRICS.momentum.coolingPct?'red':'';
 const category=scoringQuadrant(average,cv);
 const definition=`Averages ${fmt(average,1)} points per week with ${fmt(cv*100,1)}% relative weekly volatility.`;
 return [t.id,{scores,average,sd,low,high,spread,cv,category,definition,old,recent,shift,relShift,momentum,trendClass,window}];
}));}
function identityBadge(t){return historicalFranchiseDNA(t);}

function profileMini(t){let p=scoringProfiles[t.id];return `<div class="dna-cards"><div class="dna-mini"><span>Average</span><strong>${fmt(p.average,1)}</strong><small>points / week</small></div><div class="dna-mini"><span>Floor</span><strong>${fmt(p.low,1)}</strong><small>lowest final score</small></div><div class="dna-mini"><span>Ceiling</span><strong>${fmt(p.high,1)}</strong><small>highest final score</small></div><div class="dna-mini"><span>Volatility</span><strong>${fmt(p.sd,1)}</strong><small>standard deviation · lower is steadier</small></div></div>`}
function weeklyDNA(t){
 const p=scoringProfiles[t.id],max=Math.max(...teams.flatMap(z=>scoringProfiles[z.id].scores),1);

  <div><label for="draftYear">SEASON</label><select id="draftYear" class="select" aria-label="Select draft year">${choices(DRAFTS.seasons.map(s=>[s.year,String(s.year)]),state.draftYear)}</select></div>
  <div><label for="draftFranchise">FRANCHISE</label><select id="draftFranchise" class="select" aria-label="Filter by franchise">${choices([['all','All franchises'],...options.map(t=>[t.id,t.name+(t.name!==t.old?' · '+t.old:'')])],state.draftFranchise)}</select></div>
  <div><label for="draftRound">ROUND</label><select id="draftRound" class="select" aria-label="Filter by draft round">${choices([['all','All rounds'],...Array.from({length:season.rounds},(_,i)=>[i+1,'Round '+(i+1)])],state.draftRound)}</select></div>
  <div><label for="draftPosition">POSITION</label><select id="draftPosition" class="select" aria-label="Filter by drafted position">${choices([['all','All positions'],...['QB','RB','WR','TE','K','D/ST',...(season.historical_punter_position?['P']:[])].map(pos=>[pos,pos])],state.draftPosition)}</select></div>
  <div><label for="draftTag">OUTCOME</label><select id="draftTag" class="select" aria-label="Filter draft outcome">${choices([['all','All outcomes'],...['STEAL','HIT','NEUTRAL','BUST',...(season.historical_punter_position?['ERA_ONLY']:[]),...(season.year===2026?['PENDING']:[])].map(tag=>[tag,tag==='ERA_ONLY'?'Punter era':tag])],state.draftTag)}</select></div>
  <input id="draftQuery" type="search" placeholder="Search player, current franchise or historical team name" aria-label="Search draft history" value="${esc(state.draftQuery)}" />
 </div><div class="draft-results" id="draftResultCount">${draftFilteredPicks().length} of ${season.total_picks} picks shown · Year-specific ESPN player records · Grades use retrospective model v1</div>
 <div class="tablewrap"><table class="history-table draft-table"><thead><tr><th class="num">Overall</th><th class="num">Round</th><th class="num">Pick</th><th>Player</th><th>Pos.</th><th>Current franchise / season team</th><th>Draft outcome / value</th></tr></thead><tbody id="draftRows">${draftRows()}</tbody></table></div>
 <p class="history-note">Historical draft ownership follows the person, not a reused ESPN team slot. Former participants remain in older seasons under a historical-franchise label. Original draft selections are not adjusted for trades or later roster moves. Draft outcomes use actual same-season fantasy scoring relative to draft cost, not injuries or roster-manager decisions; 2021–2022 punters are excluded from Draft DNA. 2026 is pending.</p></div>`;
}

function historyPage(){
 return viewSwitch('history',[['yearbook','Yearbook'],['legacy','Franchise Legacy'],['titles','Championships'],['draft','Draft History']],state.historyView)+(state.historyView==='legacy'?historyLegacy():state.historyView==='titles'?historyChampions():state.historyView==='draft'?draftPage():historyYearbook());
}

const titles={overview:['League overview','Standings, recent form and schedule luck in one view.'],teams:['Teams','One franchise · Report Card, Team DNA and Lineup Quality.'],history:['History','Season yearbooks, owner-linked franchise legacy and verified champions.']};
const functions={overview,teams:teamsPage,history:historyPage};
function render(){document.getElementById('view').innerHTML=functions[state.tab]();document.getElementById('pageTitle').textContent=titles[state.tab][0];document.getElementById('intro').textContent=titles[state.tab][1];document.querySelectorAll('[data-tab]').forEach(el=>el.classList.toggle('active',el.dataset.tab===state.tab));document.getElementById('teamSelect').value=String(state.selected);document.getElementById('weekStatus').textContent=`${METRICS.season} · Finalized through Week ${DB.completedThrough}${sourceFallback?' · Embedded approved copy':''}`;const mobile=document.getElementById('mobileSection');if(mobile)mobile.value=state.tab;}
function init(){document.getElementById('teamSelect').innerHTML=teams.map(t=>`<option value="${t.id}">${teamNameText(t)}</option>`).join('');document.getElementById('mobileNav').innerHTML=`<label for="mobileSection">EXPLORE</label><select id="mobileSection" aria-label="Dashboard section">${navTabs.map(([id,name])=>`<option value="${id}">${name}</option>`).join('')}</select>`;document.getElementById('mobileSection').addEventListener('change',e=>{state.tab=e.target.value;render();window.scrollTo(0,0)});render()}
document.addEventListener('click',e=>{
 let sub=e.target.closest('[data-team-view]');
 if(sub){state.teamView=sub.dataset.teamView;state.tab='teams';render();return;}
 sub=e.target.closest('[data-history-view]');
 if(sub){state.historyView=sub.dataset.historyView;state.tab='history';render();return;}
 let step=e.target.closest('[data-card-step]');
 if(step){const ordered=[...teams].sort((a,b)=>b.pf-a.pf||b.wins-a.wins),i=ordered.findIndex(t=>t.id===state.selected),next=ordered[i+Number(step.dataset.cardStep)];if(next)state.selected=next.id;render();return;}
 let expanded=e.target.closest('[data-expand-standing]');
 if(expanded){let id=Number(expanded.dataset.expandStanding);state.expandedStanding=state.expandedStanding===id?null:id;render();return;}
 let range=e.target.closest('[data-range]');
 if(range){state.weekRange=range.dataset.range;render();return;}
 let quadrant=e.target.closest('[data-quadrant]');
 if(quadrant){state.quadrant=state.quadrant===quadrant.dataset.quadrant?'all':quadrant.dataset.quadrant;render();return;}
 let btn=e.target.closest('[data-tab]');
 if(btn){state.tab=btn.dataset.tab;if(btn.dataset.teamDestination)state.teamView=btn.dataset.teamDestination;render();window.scrollTo(0,0);return;}
 btn=e.target.closest('[data-select]');
 if(btn){state.selected=Number(btn.dataset.select);if(btn.dataset.jump)state.tab=btn.dataset.jump;else if(state.tab==='overview'){state.tab='teams';state.teamView='card';}render();if(state.tab==='teams')window.scrollTo(0,0);return;}
});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const row=e.target.closest('[data-select]');if(row&&row.tagName==='TR'){e.preventDefault();state.selected=Number(row.dataset.select);render();}});
document.getElementById('teamSelect').addEventListener('change',e=>{state.selected=Number(e.target.value);if(state.tab==='overview'){state.tab='teams';state.teamView='card';}render();});
document.addEventListener('change',e=>{
 if(e.target.id==='historyYear'){const year=Number(e.target.value);if(HISTORICAL_SCORES.seasons.some(s=>s.year===year)){state.historyYear=year;render();}}
 if(e.target.id==='playoffYear'){const year=Number(e.target.value);if(PLAYOFFS.seasons[String(year)]){state.playoffYear=year;render();}}
 if(e.target.id==='draftYear'){const year=Number(e.target.value);if(DRAFTS.seasons.some(s=>s.year===year)){state.draftYear=year;state.draftFranchise='all';state.draftRound='all';state.draftPosition='all';state.draftTag='all';state.draftQuery='';render();}}
 if(e.target.id==='draftFranchise'){state.draftFranchise=e.target.value;render();}
 if(e.target.id==='draftRound'){state.draftRound=e.target.value;render();}
 if(e.target.id==='draftPosition'){state.draftPosition=e.target.value;render();}
 if(e.target.id==='draftTag'){state.draftTag=e.target.value;render();}
});
document.addEventListener('input',e=>{
 if(e.target.id==='draftQuery'){
  state.draftQuery=e.target.value;
  const body=document.getElementById('draftRows');
  const count=document.getElementById('draftResultCount');
  if(body)body.innerHTML=draftRows();
  if(count)count.textContent=draftFilteredPicks().length+' of '+draftSeason().total_picks+' picks shown · Year-specific ESPN player records · Grades use retrospective model v1';
 }
});
function validatePublicData(fresh){
 if(!fresh||fresh.completedThrough<4||fresh.completedThrough>18||!Array.isArray(fresh.teams)||fresh.teams.length!==10)throw new Error('Invalid approved data');
 if(fresh.leagueId!==undefined && Number(fresh.leagueId)!==418244680)throw new Error('Wrong league');
 if(fresh.season!==undefined && Number(fresh.season)!==2026)throw new Error('Wrong season');
 const ids=fresh.teams.map(t=>t.id);if(new Set(ids).size!==10)throw new Error('Duplicate team IDs');
 if(!fresh.teams.every(t=>Array.isArray(t.weeks)&&t.weeks.length===fresh.completedThrough))throw new Error('Incomplete weeks');
 const known=new Set(ids);for(const t of fresh.teams){let wins=0,pf=0,pa=0;
  for(let i=0;i<t.weeks.length;i++){let w=t.weeks[i];if(w.week!==i+1||!known.has(w.opp)||w.opp===t.id||![w.pf,w.pa].every(v=>Number.isFinite(v)&&v>=0))throw new Error('Invalid weekly matchup');wins+=Number(w.win)||0;pf+=w.pf;pa+=w.pa;}
  if(Math.abs(pf-t.pf)>.05||Math.abs(pa-t.pa)>.05||wins!==t.wins)throw new Error('Season totals inconsistent');
 }
 const indexed=Object.fromEntries(fresh.teams.map(t=>[t.id,t]));for(const t of fresh.teams)for(const w of t.weeks){const peer=indexed[w.opp].weeks[w.week-1];if(peer.opp!==t.id||Math.abs(peer.pf-w.pa)>.02||Math.abs(peer.pa-w.pf)>.02)throw new Error('Non-symmetric matchup');}
 if(fresh.rosterAnalysis){
  const ra=fresh.rosterAnalysis;
  if(ra.status!=='validated-final-rosters'||ra.throughWeek!==fresh.completedThrough||!Array.isArray(ra.weeks)||ra.weeks.length!==fresh.completedThrough)throw new Error('Incomplete finalized roster analysis');
  for(let i=0;i<ra.weeks.length;i++){
   const rw=ra.weeks[i];if(rw.week!==i+1||!Array.isArray(rw.teams)||rw.teams.length!==10||new Set(rw.teams.map(z=>z.teamId)).size!==10||!rw.teams.every(z=>known.has(z.teamId)&&z.weightedPossible===8&&z.weightedHits>=0&&z.weightedHits<=z.weightedMax&&z.weightedMax<=8))throw new Error('Invalid finalized roster analysis');
  }
 }
 if(fresh.completedThrough<DB.completedThrough)throw new Error('Older than approved embedded snapshot');
 if(fresh.completedThrough===DB.completedThrough){
  const oldTime=Date.parse(DB.approvedAt||DB.generated||0),newTime=Date.parse(fresh.approvedAt||fresh.generated||0);
  if(Number.isFinite(oldTime)&&Number.isFinite(newTime)&&newTime<oldTime)throw new Error('Older approval timestamp');
  const oldById=Object.fromEntries(DB.teams.map(t=>[t.id,t]));
  for(const t of fresh.teams){const prior=oldById[t.id];if(!prior)throw new Error('Unknown team');for(let i=0;i<t.weeks.length;i++){let a=t.weeks[i],b=prior.weeks[i];if(a.pf!==b.pf||a.pa!==b.pa||a.opp!==b.opp)throw new Error('Unapproved same-week stat correction');}}
 }
 return true;
}
function dataTimestamp(db){let s=db.approvedAt||db.generated;if(!s)return 'time not recorded';let date=new Date(s);return Number.isNaN(date.getTime())?'time not recorded':date.toLocaleString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'});}
function showStatus(embedded,error){
 sourceFallback=!!embedded;
 const badge=document.getElementById('weekStatus');
 badge.title=embedded?(error?'External data unavailable or rejected; using the matching approved embedded snapshot.':'Approved embedded snapshot.'):'Validated ESPN data';
}
async function loadData(){let fallback=false,problem=null;
 try{const resp=await fetch('./data/league.json?v='+Date.now(),{cache:'no-store'});if(!resp.ok)throw new Error('External data unavailable');const fresh=await resp.json();validatePublicData(fresh);DB=fresh;teams=DB.teams;byId=Object.fromEntries(teams.map(t=>[t.id,t]));leagueMean=mean(teams.map(t=>t.pf/DB.completedThrough));scoringProfiles=buildScoringProfiles();}
 catch(error){fallback=true;problem=error;}
 showStatus(fallback,problem);init();
}
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-select][role="button"]')){e.preventDefault();state.selected=Number(e.target.dataset.select);render();}});
loadData();
})();
</script></body></html>

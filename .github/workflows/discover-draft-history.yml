name: Research archived ESPN draft availability (private)

on:
  push:
    branches: [research/draft-coverage-2021-2026]
    paths:
      - 'scripts/discover_draft_history.py'
      - 'scripts/build_historical_draft_snapshot.py'
      - '.github/workflows/discover-draft-history.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover-drafts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check all six draft histories
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/discover_draft_history.py
      - name: Validate and build approved public draft snapshot
        run: python scripts/build_historical_draft_snapshot.py
      - name: Upload private, sanitized draft records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draft-coverage-private
          path: output/draft-coverage/*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Commit approved anonymous draft snapshot to research branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reference/historical_draft_picks.json
          git diff --cached --quiet || git commit -m "Stage verified six-season draft picks with original-season player names"
          git push origin HEAD:research/draft-coverage-2021-2026

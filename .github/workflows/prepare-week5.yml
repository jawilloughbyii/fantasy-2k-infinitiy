name: Prepare verified 2026 Week 5 snapshot (review only)

on:
  push:
    branches: [data/2026-week-5-verified]
    paths:
      - '.github/workflows/prepare-week5.yml'
      - 'scripts/test_pipeline.py'
      - 'scripts/test_dashboard.cjs'
      - 'scripts/test_acquisition_backfill.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-week5:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out isolated review branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check original baseline and run offline pipeline tests
        run: |
          python scripts/test_pipeline.py
          python scripts/test_roster_analysis.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/league.json').read_text())
          assert d['completedThrough']==4, 'Unexpected baseline; stop rather than overwrite later published data'
          assert d['rosterAnalysis']['throughWeek']==4 and len(d['rosterAnalysis']['weeks'])==4
          PY
      - name: Retrieve ESPN results and reconcile approved 40 original team-weeks
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/refresh.py --output-dir output
      - name: Build anonymous scoring data and require exactly finalized Week 5
        run: |
          python scripts/build_site_data.py --report output/validation.json --baseline-html index.html --output output/league.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('output/validation.json').read_text())
          d=json.loads(Path('output/league.json').read_text())
          assert report['validation']['passed'] and report['validation']['verified_team_scores']==40
          assert int(report['current_matchup_period'])==6, 'Require current ESPN period 6: Week 5 finalized and Week 6 active'
          assert d['completedThrough']==5 and len(d['teams'])==10
          assert all([w['week'] for w in t['weeks']]==[1,2,3,4,5] for t in d['teams'])
          assert sum(len(t['weeks']) for t in d['teams'])==50
          matches=[m for m in report['matchups'] if m['week']==5]
          assert len(matches)==5 and {m['winner'] for m in matches}<={'HOME','AWAY'}
          assert all(m['home_points'] is not None and m['away_points'] is not None for m in matches)
          print('Week 5: five finalized matchups, ten verified team scores, 50 cumulative team-weeks.')
          PY
      - name: Retrieve and independently validate finalized lineups for Weeks 1-5
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/roster_analysis.py --league-data output/league.json --mapping reference/team_id_map.json --output output/roster_analysis.json
      - name: Attach roster quality and preserve original approved evidence
        run: |
          python scripts/attach_roster_analysis.py --league-data output/league.json --roster-data output/roster_analysis.json --output output/approved-league.json
          python - <<'PY'
          import json
          from pathlib import Path
          old=json.loads(Path('data/league.json').read_text())
          new=json.loads(Path('output/approved-league.json').read_text())
          assert new['completedThrough']==5
          assert new['rosterAnalysis']['status']=='validated-final-rosters'
          assert new['rosterAnalysis']['throughWeek']==5
          assert [w['week'] for w in new['rosterAnalysis']['weeks']]==[1,2,3,4,5]
          assert len(new['rosterAnalysis']['weeks'][4]['teams'])==10
          assert new['rosterAnalysis']['weeks'][:4]==old['rosterAnalysis']['weeks'], 'Original approved roster results changed'
          for prior in old['teams']:
              updated=next(t for t in new['teams'] if t['id']==prior['id'])
              assert prior['weeks']==updated['weeks'][:4], 'Original approved scores or opponent data changed'
              assert prior['name']==updated['name'], 'Team identity changed'
          for key in ('projectionCoverage',):
              assert old[key]['throughWeek']==new[key]['throughWeek']==4
          serialized=json.dumps(new).lower()
          assert not any(k in serialized for k in ('espn_s2','espn_swid','espn_cookie','owner_name','manager_name','first_name','last_name'))
          PY
          python scripts/sync_site_snapshot.py --html index.html --data output/approved-league.json --output output/index.html
      - name: Stage only approved public JSON and synchronized HTML
        run: |
          cp output/approved-league.json data/league.json
          cp output/index.html index.html
          python scripts/test_pipeline.py
          python scripts/test_roster_analysis.py
          python scripts/test_historical_dna.py
          python scripts/test_legacy_history.py
          python scripts/test_legacy_enriched.py
          python scripts/test_acquisition_dna.py
          python scripts/test_acquisition_backfill.py
          python scripts/test_historical_playoffs.py
          python scripts/test_historical_drafts.py
          python scripts/test_historical_draft_grades.py
          node scripts/test_dashboard.cjs
          python scripts/sync_site_snapshot.py --html index.html --data data/league.json --output output/rechecked-index.html
          cmp index.html output/rechecked-index.html
          git diff --check
          git status --short
      - name: Commit validated Week 5 snapshot to review branch only
        run: |
          git add -- data/league.json index.html
          git diff --cached --exit-code && { echo 'No Week 5 changes were staged'; exit 1; } || test "$?" -eq 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Prepare validated Week 5 2026 scoring and finalized roster snapshot"
          git push origin HEAD:data/2026-week-5-verified

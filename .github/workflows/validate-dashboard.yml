name: Validate dashboard metrics and UI

on:
  pull_request:
    paths:
      - 'index.html'
      - 'data/league.json'
      - 'reference/metric_definitions.json'
      - 'reference/acquisition_dna.json'
      - 'reference/historical_regular_season_scores.json'
      - 'reference/historical_legacy_draft_picks_2014_2017.json'
      - 'reference/historical_legacy_scoring_2014_2017.json'
      - 'reference/historical_legacy_official_standings_2014_2017.json'
      - 'research/espn-791996-2014-2017/**'
      - 'reference/championship_history.json'
      - 'reference/historical_playoff_brackets.json'
      - 'reference/historical_draft_picks.json'
      - 'reference/historical_draft_grades.json'
      - 'reference/franchise_continuity.json'
      - 'reference/team_id_map.json'
      - 'scripts/build_site_data.py'
      - 'scripts/sync_site_snapshot.py'
      - 'scripts/test_dashboard.cjs'
      - 'scripts/acquisition_dna.py'
      - 'scripts/test_acquisition_dna.py'
      - 'scripts/test_acquisition_backfill.py'
      - 'scripts/reconcile_acquisition_2026.py'
      - 'scripts/audit_acquisition_2026.py'
      - 'scripts/test_reconcile_acquisition_2026.py'
      - 'scripts/test_audit_acquisition_2026.py'
      - '.github/workflows/preview-2026-acquisition-chain.yml'
      - 'scripts/backfill_acquisition_provenance.py'
      - 'scripts/test_historical_dna.py'
      - 'scripts/test_legacy_history.py'
      - 'scripts/test_legacy_enriched.py'
      - 'scripts/test_historical_playoffs.py'
      - 'scripts/test_historical_drafts.py'
      - 'scripts/test_historical_draft_grades.py'
      - 'scripts/test_pipeline.py'
      - 'scripts/test_roster_analysis.py'
      - 'README.md'
      - '.github/workflows/validate-dashboard.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data/league.json'
      - 'reference/metric_definitions.json'
      - 'reference/acquisition_dna.json'
      - 'reference/historical_regular_season_scores.json'
      - 'reference/championship_history.json'
      - 'reference/historical_playoff_brackets.json'
      - 'reference/historical_draft_picks.json'
      - 'reference/historical_draft_grades.json'
      - 'reference/franchise_continuity.json'
      - 'reference/team_id_map.json'
      - 'scripts/**'
      - '.github/workflows/validate-dashboard.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify processed ESPN data pipeline
        run: python scripts/test_pipeline.py
      - name: Verify legal roster optimization
        run: python scripts/test_roster_analysis.py
      - name: Verify completed historical seasons and franchise DNA weighting
        run: python scripts/test_historical_dna.py
      - name: Reconcile merged 2014–2017 original ESPN league history
        run: python scripts/test_legacy_history.py
      - name: Validate original-year drafted player metadata, scoring definitions and official records
        run: python scripts/test_legacy_enriched.py
      - name: Validate starter-week acquisition mix, yield and independent execution
        run: python scripts/test_acquisition_dna.py
      - name: Verify read-only full-period acquisition evidence contract
        run: python scripts/test_acquisition_backfill.py
      - name: Verify strict 2026 acquisition ownership replay and private preview gates
        run: |
          python scripts/test_reconcile_acquisition_2026.py
          python scripts/test_audit_acquisition_2026.py
      - name: Verify historical postseason brackets, final scores and franchise titles
        run: python scripts/test_historical_playoffs.py
      - name: Verify six-season historical drafts and owner identities
        run: python scripts/test_historical_drafts.py
      - name: Validate retrospective draft grades and owner-linked Draft DNA
        run: python scripts/test_historical_draft_grades.py
      - name: Verify approved snapshots and active dashboard pages
        run: node scripts/test_dashboard.cjs
      - name: Verify snapshot synchronization preserves championship metadata
        run: |
          python scripts/sync_site_snapshot.py --html index.html --data data/league.json --output /tmp/fantasy-sync-check.html
          cmp index.html /tmp/fantasy-sync-check.html

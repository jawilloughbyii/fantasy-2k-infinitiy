name: ESPN dashboard data preview (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source files
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline regression tests
        run: python scripts/test_pipeline.py
      - name: Retrieve and validate private ESPN results
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/refresh.py --output-dir output
      - name: Build public-safe JSON (no publishing)
        run: python scripts/build_site_data.py --report output/validation.json --baseline-html index.html --output output/league.json
      - name: Upload preview data and validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fantasy-site-data-preview
          path: output/*.json
          if-no-files-found: warn
          retention-days: 7

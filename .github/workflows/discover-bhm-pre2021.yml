name: Discover pre-2021 BHM ESPN history (private)

on:
  push:
    branches: [research/bhm-pre2021-league-discovery]
    paths:
      - 'scripts/discover_bhm_pre2021.py'
      - 'scripts/probe_bhm_endpoint_matrix.py'
      - 'scripts/probe_bhm_host_control.py'
      - '.github/workflows/discover-bhm-pre2021.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe source league 1435116 and summarize recoverable seasons
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/discover_bhm_pre2021.py
      - name: Verify single-view and no-view older ESPN endpoints
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/probe_bhm_endpoint_matrix.py
      - name: Verify authenticated control and alternate ESPN archive host
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/probe_bhm_host_control.py
      - name: Upload sanitized private season discovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bhm-pre2021-private-discovery
          path: output/bhm-pre2021-discovery/*.json
          if-no-files-found: warn
          retention-days: 7

name: Prepare verified 2026 latest finalized weeks (review only)

on:
  push:
    branches: [data/2026-latest-finalized-20261122]
    paths:
      - '.github/workflows/prepare-latest-2026.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify approved Week 9 baseline
        run: |
          python scripts/test_pipeline.py
          python scripts/test_roster_analysis.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/league.json').read_text())
          assert d['completedThrough']==9
          assert d['rosterAnalysis']['throughWeek']==9 and len(d['rosterAnalysis']['weeks'])==9
          assert len(d['teams'])==10 and all(len(t['weeks'])==9 for t in d['teams'])
          PY
      - name: Retrieve authenticated ESPN matchup and score evidence
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/refresh.py --output-dir output
      - name: Build only approved completed, finalized weeks
        run: |
          python scripts/build_site_data.py --report output/validation.json --baseline-html index.html --output output/league.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('output/validation.json').read_text())
          d=json.loads(Path('output/league.json').read_text())
          period=int(report['current_matchup_period'])
          latest=d['completedThrough']
          assert report['validation']['passed'] and report['validation']['verified_team_scores']==40
          assert 10<=period<=15, f'Unexpected ESPN current matchup period {period}'
          assert latest==period-1, f'Current period {period} requires exactly {period-1} finalized weeks, got {latest}'
          assert 10<=latest<=14, 'Require at least one newly finalized regular-season week and at most 14'
          assert len(d['teams'])==10 and all([w['week'] for w in t['weeks']]==list(range(1,latest+1)) for t in d['teams'])
          assert sum(len(t['weeks']) for t in d['teams'])==10*latest
          for week in range(10,latest+1):
              matches=[m for m in report['matchups'] if m['week']==week]
              assert len(matches)==5 and {m['winner'] for m in matches}<={'HOME','AWAY'}, f'W{week}: unfinished matchups'
              assert all(m['home_points'] is not None and m['away_points'] is not None for m in matches)
              print(f'Week {week}: verified five finalized matchups and ten team scores')
          print(f'ESPN current period {period}; approved through Week {latest}')
          PY
      - name: Retrieve and validate all finalized weekly starting lineups
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/roster_analysis.py --league-data output/league.json --mapping reference/team_id_map.json --output output/roster_analysis.json
      - name: Attach and ensure every previously published team-week stays identical
        run: |
          python scripts/attach_roster_analysis.py --league-data output/league.json --roster-data output/roster_analysis.json --output output/approved-league.json
          python - <<'PY'
          import json
          from pathlib import Path
          old=json.loads(Path('data/league.json').read_text())
          new=json.loads(Path('output/approved-league.json').read_text())
          latest=new['completedThrough']
          assert latest>=10
          assert new['rosterAnalysis']['status']=='validated-final-rosters'
          assert new['rosterAnalysis']['throughWeek']==latest
          assert [w['week'] for w in new['rosterAnalysis']['weeks']]==list(range(1,latest+1))
          assert all(len(w['teams'])==10 for w in new['rosterAnalysis']['weeks'])
          assert new['rosterAnalysis']['weeks'][:9]==old['rosterAnalysis']['weeks'], 'Prior nine weeks of roster data changed'
          for prior in old['teams']:
              updated=next(t for t in new['teams'] if t['id']==prior['id'])
              assert prior['weeks']==updated['weeks'][:9], 'Previously approved team-week scores/opponents changed'
              assert prior['name']==updated['name'] and prior['division']==updated['division'], 'Team identity changed'
          assert old['projectionCoverage']['throughWeek']==new['projectionCoverage']['throughWeek']==4
          serialized=json.dumps(new).lower()
          assert not any(k in serialized for k in ('espn_s2','espn_swid','espn_cookie','owner_name','manager_name','first_name','last_name'))
          print(f'Validated {latest*10} finalized lineup records; previously approved 90 team-weeks unchanged')
          PY
          python scripts/sync_site_snapshot.py --html index.html --data output/approved-league.json --output output/index.html
      - name: Validate synchronized dashboard and every regression suite
        run: |
          cp output/approved-league.json data/league.json
          cp output/index.html index.html
          python scripts/test_pipeline.py
          python scripts/test_roster_analysis.py
          python scripts/test_historical_dna.py
          python scripts/test_legacy_history.py
          python scripts/test_legacy_enriched.py
          python scripts/test_acquisition_dna.py
          python scripts/test_acquisition_backfill.py
          python scripts/test_historical_playoffs.py
          python scripts/test_historical_drafts.py
          python scripts/test_historical_draft_grades.py
          python scripts/test_franchise_identity.py
          node scripts/test_dashboard.cjs
          python scripts/sync_site_snapshot.py --html index.html --data data/league.json --output output/rechecked-index.html
          cmp index.html output/rechecked-index.html
          git diff --check
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed=={'data/league.json','index.html'}, f'Unexpected public file changes {changed}'
          PY
      - name: Commit approved public data to isolated review branch
        run: |
          git add -- data/league.json index.html
          git diff --cached --quiet && { echo 'No new approved changes'; exit 1; } || test "$?" -eq 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh verified finalized 2026 scores and lineup metrics"
          git push origin HEAD:data/2026-latest-finalized-20261122
